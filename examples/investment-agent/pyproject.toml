[project]
name = "investment-agent-example"
version = "0.1.0"
description = "Investment research Deep Agent with specialist analyst subagents, a FastAPI server, and a web UI"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.0",
    "langchain-anthropic>=1.6.1,<2.0.0",
    "yfinance>=0.2.54",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "httpx>=0.28.1",
    "tavily-python>=0.7.26",
    "python-dotenv>=1.2.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "langgraph-cli[inmem]>=0.4.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.15.20",
]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["investment_agent", "investment_agent.tools"]
py-modules = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# See "Warnings are errors" in the repository AGENTS.md.
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
    "B",
]
lint.ignore = [
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
